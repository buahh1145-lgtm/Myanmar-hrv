<!DOCTYPE html>
<html lang="my">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Myanmar HRV</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
background:#0c111d;
color:white;
font-family:'Noto Sans Myanmar',sans-serif;
margin:0;
}

nav{
background:#05080f;
padding:15px 25px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.hero{
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:40px;
}

.hero span{
color:#e84054;
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
}

.stat{
background:#192035;
padding:15px 20px;
border-radius:8px;
text-align:center;
}

.stat-number{
font-size:26px;
font-weight:bold;
}

section{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

.card{
background:#192035;
border-radius:10px;
padding:15px;
border:1px solid rgba(255,255,255,0.05);
}

.card-title{
font-weight:600;
margin-bottom:8px;
}

.card-meta{
font-size:12px;
color:#aaa;
margin-bottom:10px;
}

</style>

</head>

<body>

<nav>
Myanmar Human Rights Watch
</nav>

<div class="hero">

<h1>မြန်မာ <span>လူ့အခွင့်အရေး</span> မှတ်တမ်း</h1>

<div class="stats">

<div class="stat">
<div id="total" class="stat-number">0</div>
<div>Total Cases</div>
</div>

<div class="stat">
<div id="killed" class="stat-number">0</div>
<div>Killed</div>
</div>

<div class="stat">
<div id="injured" class="stat-number">0</div>
<div>Injured</div>
</div>

</div>

</div>


<section>

<h2>Latest Incidents</h2>

<div id="newsGrid" class="news-grid"></div>

</section>


<!-- Firebase -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

import { FIREBASE_CONFIG } from './firebase-config.js';

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);

const incidentsRef = ref(db,"incidents");

const grid = document.getElementById("newsGrid");

let total=0
let killed=0
let injured=0

onValue(incidentsRef,(snapshot)=>{

grid.innerHTML=""

snapshot.forEach(child=>{

const data=child.val()

total++

if(data.killed) killed+=data.killed
if(data.injured) injured+=data.injured

const card=document.createElement("div")
card.className="card"

card.innerHTML=`

<div class="card-title">${data.title || "Incident"}</div>

<div class="card-meta">
${data.date || ""} | ${data.location || ""}
</div>

<div>${data.description || ""}</div>

`

grid.prepend(card)

})

document.getElementById("total").innerText=total
document.getElementById("killed").innerText=killed
document.getElementById("injured").innerText=injured

})

</script>


</body>
</html>
